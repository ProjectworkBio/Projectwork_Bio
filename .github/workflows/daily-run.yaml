name: Daily Script Run

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:  # allows manual triggering

jobs:
  run-daily-script:
    runs-on: self-hosted

    steps:
      # Pull the latest version of your repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Run your script
      - name: Execute script
        run: ./Projectwork_Bio/compare_files.py
