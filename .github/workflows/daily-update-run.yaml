name: Scheduled Run of update files

on:
  schedule:
    - cron: '20 0 * * *' # 00:20 UTC
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      #- name: Install project dependencies
       # run: pip install .

      - name: Run Python script
        run: python Data_extraction_pipeline/updates.py
